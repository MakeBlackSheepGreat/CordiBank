name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            web/package-lock.json

      - name: 安装运行时依赖
        run: npm --prefix runtime ci

      - name: 安装前端依赖
        run: npm --prefix web ci

      - name: 运行时类型检查
        run: npm --prefix runtime run build

      - name: 前端构建
        run: npm --prefix web run build

      - name: 自动化测试
        run: npm --prefix runtime test

      - name: MCP 服务自检
        run: node mcp/selftest.mjs

  # 手动触发的安全评测：需要仓库密钥 DEEPSEEK_API_KEY（Settings → Secrets → Actions）。
  # 覆盖 G1-G10 指标（注入拦截/误拦/越权/脱敏/审计完整/防篡改/P95）、120 条意图/槽位测试集
  # 与 19 项红队攻防。PR 与推送门禁不跑此作业，保持确定性。
  security-eval:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: "${{ secrets.DEEPSEEK_API_KEY != '' }}"
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: 安装运行时依赖
        run: npm --prefix runtime ci

      - name: 构建运行时
        run: npm --prefix runtime run build

      - name: 意图与槽位评测（G2/G3）
        run: node scripts/intent-eval.mjs

      - name: 安全评测（G1-G10）
        if: env.HAS_KEY == 'true'
        env:
          DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"
        run: node scripts/evaluate.mjs

      - name: 红队攻防（19 项）
        if: env.HAS_KEY == 'true'
        env:
          DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"
        run: node scripts/redteam-attack.mjs

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: .eval-report.json
          if-no-files-found: ignore


  # 桌面端构建验证：exe 安装包 + 免安装 zip 的可构建性与启动冒烟。
  # 发布产物由 release.yml（tag 触发）附加到 GitHub Release，这里只做门禁。
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: 安装依赖
        run: |
          npm --prefix runtime ci
          npm --prefix web ci
          npm --prefix desktop ci

      - name: 预下载 Electron 运行时（与 electronDist 缓存约定一致）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/.electron-cache | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://github.com/electron/electron/releases/download/v45.1.0/electron-v45.1.0-win32-x64.zip" "-OutFile" desktop/.electron-cache/electron-v45.1.0-win32-x64.zip
          $hash = (Get-FileHash desktop/.electron-cache/electron-v45.1.0-win32-x64.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "55eaba17abff7b5bba6c3bbc85068967379024fe742fe9c7fdba9118922ccbe2") { throw "electron 运行时校验和不符: $hash" }

      - name: 构建安装包与免安装包
        run: npm --prefix desktop run dist

      - name: 启动冒烟（免安装版拉起 15 秒不退出）
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/release/win-unpacked" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1
          if (-not $exe) { throw "win-unpacked 缺主程序" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "应用启动后退出（exit=$($p.ExitCode))" }
          "smoke ok: $($exe.Name) 存活 15s"
          Stop-Process -Id $p.Id -Force
