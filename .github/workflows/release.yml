name: release

# 推送 v* 标签即发布：
# - release 作业（Linux）：完整门禁 → 打包含构建产物的源码发行包 → 创建 GitHub Release。
# - desktop 作业（Windows）：构建 NSIS 安装包与免安装 zip → 启动冒烟 → 附到同一 Release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            web/package-lock.json

      - name: 安装依赖
        run: |
          npm --prefix runtime ci
          npm --prefix web ci

      - name: 运行时类型检查与构建
        run: npm --prefix runtime run build

      - name: 前端构建
        run: npm --prefix web run build

      - name: 自动化测试
        run: npm --prefix runtime test

      - name: MCP 服务自检
        run: node mcp/selftest.mjs

      - name: 打包发行包（含 runtime/dist 与 web/dist）
        run: |
          VERSION="${GITHUB_REF_NAME}"
          zip -rqy "cordibank-$VERSION.zip" . \
            -x ".git/*" \
            -x "*/node_modules/*" \
            -x ".github/*" \
            -x ".shot-tmp/*" ".work/*" "_scratch/*" ".dsh-src-tmp/*" ".dsh-ops/*"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cordibank-*.zip
          generate_release_notes: true

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: 安装依赖
        run: |
          npm --prefix runtime ci
          npm --prefix web ci
          npm --prefix desktop ci

      - name: 预下载 Electron 运行时（与 electronDist 缓存约定一致）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/.electron-cache | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://github.com/electron/electron/releases/download/v45.1.0/electron-v45.1.0-win32-x64.zip" -OutFile desktop/.electron-cache/electron-v45.1.0-win32-x64.zip
          $hash = (Get-FileHash desktop/.electron-cache/electron-v45.1.0-win32-x64.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "55eaba17abff7b5bba6c3bbc85068967379024fe742fe9c7fdba9118922ccbe2") { throw "electron 运行时校验和不符: $hash" }

      - name: 构建安装包与免安装包
        run: npm --prefix desktop run dist

      - name: 启动冒烟（免安装版拉起 15 秒不退出）
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/release/win-unpacked" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1
          if (-not $exe) { throw "win-unpacked 缺主程序" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "应用启动后退出（exit=$($p.ExitCode))" }
          "smoke ok: $($exe.Name) 存活 15s"
          Stop-Process -Id $p.Id -Force

      - name: 附到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
